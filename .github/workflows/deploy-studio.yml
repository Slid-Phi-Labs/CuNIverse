name: Deploy Studio

on:
  push:
    branches: [master]
    paths:
      - 'playground/**'
      - 'fly.toml'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: read

# Deploys queue without cancel so two pushes never deploy concurrently
# and neither deploy is cancelled mid-flight.
concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CuNi Studio to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require FLY_API_TOKEN
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not configured. Add it under Repo Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master

      - name: Deploy
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
