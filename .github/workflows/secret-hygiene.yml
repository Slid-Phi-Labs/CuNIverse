name: Secret hygiene

# Monthly: fail if the Fly deploy token for spl-cuni-studio expires in
# under 21 days, so rotation happens before deploys break.
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-hygiene
  cancel-in-progress: false

jobs:
  fly-token-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - name: Fail if Fly token expires within 21 days
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not configured. Add it under Repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          flyctl tokens list --app spl-cuni-studio --json > tokens.json
          python3 - <<'EOF'
          import datetime, json, sys
          toks = json.load(open("tokens.json"))
          active = [t for t in toks if not t.get("revoked_at")]
          assert active, "no active Fly tokens for spl-cuni-studio"
          def parse(s):
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))
          now = datetime.datetime.now(datetime.timezone.utc)
          nearest = min(active, key=lambda t: parse(t["expires_at"]))
          days = (parse(nearest["expires_at"]) - now).total_seconds() / 86400
          print(f"nearest active token expires in {days:.1f} days ({nearest['expires_at']})")
          if days < 21:
              print(f"::error::Fly token for spl-cuni-studio expires in {days:.1f} days (< 21). Rotate it now.")
              sys.exit(1)
          print("token expiry OK (>= 21 days)")
          EOF
