name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Go (conformance suite runs go run)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"

      - name: Go toolchain smoke (fail fast if go is not on PATH)
        run: go version

      - name: Install Node (conformance suite runs node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Node toolchain smoke
        run: node --version

      - name: Install native proof-suite toolchains
        # proof_deferred runs each real runtime, never a mocked fallback.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 elixir erlang-base clojure swi-prolog-nox ghc tcl

      - name: Install checksum-pinned native solc 0.8.28
        run: bash .github/scripts/install-solc.sh

      - name: Build
        run: cargo build --locked --verbose

      - name: Bank hook must exist
        run: |
          ./target/debug/cuni bank --help
          ./target/debug/cuni bank paste examples/bank/add.py --from py --to py


      - name: Studio citizen PASS shape smoke
        run: python3 -m unittest playground.test_citizen_pass -v

      - name: Cross-chain Solidity compilation and exactness
        run: cargo test --locked --test proof_crosschain -- --nocapture

      - name: Test
        run: cargo test --locked --verbose

  docker:
    name: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "ceedotrock/slidphi"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: playground/Dockerfile
          tags: "${{ vars.DOCKER_USER }}/cuni-studio:latest"
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
